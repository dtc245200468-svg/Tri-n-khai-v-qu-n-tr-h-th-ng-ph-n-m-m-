services:
  db:
    image: postgres:15-alpine
    container_name: hrm_db
    restart: always
    environment:
      POSTGRES_USER: hrm_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: hrm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: hrm_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hrm.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - db

  hrm-app:
    build: ./app
    container_name: hrm_app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: hrm_user
      DB_PASSWORD: secretpassword
      DB_NAME: hrm_db
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: hrm_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - hrm-app

  prometheus:
    image: prom/prometheus:latest
    container_name: hrm_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:2.9.0
    container_name: hrm_loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.0
    container_name: hrm_promtail
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: hrm_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
